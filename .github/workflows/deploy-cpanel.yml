name: Déploiement cPanel (maisonvaleria.net)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CP_HOST: ${{ secrets.CPANEL_HOST }}
      CP_USER: ${{ secrets.CPANEL_USER }}
      CP_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      CP_DIR: ${{ secrets.CPANEL_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Envoi des fichiers via l'API cPanel
        run: |
          set -e
          API="https://${CP_HOST}:2083"
          AUTH="Authorization: cpanel ${CP_USER}:${CP_TOKEN}"
          ROOT="${CP_DIR%/}"

          # Liste des fichiers à publier (hors fichiers de travail)
          find . -type f \
            ! -path './.git/*' ! -path './.github/*' ! -path './_src/*' \
            ! -name 'vercel.json' ! -name '.vercelignore' \
            | sed 's#^\./##' | sort > files.txt
          sed -i '/^files.txt$/d' files.txt

          # Création des dossiers
          for d in $(xargs -a files.txt -n1 dirname | sort -u | grep -v '^\.$'); do
            parent="$ROOT/$(dirname "$d")"; [ "$(dirname "$d")" = "." ] && parent="$ROOT"
            curl -sS -H "$AUTH" "$API/json-api/cpanel?cpanel_jsonapi_apiversion=2&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=mkdir" \
              --data-urlencode "path=$parent" --data-urlencode "name=$(basename "$d")" > /dev/null || true
          done

          # Envoi fichier par fichier (écrase l'ancienne version)
          fail=0
          while read -r f; do
            dir="$ROOT/$(dirname "$f")"; [ "$(dirname "$f")" = "." ] && dir="$ROOT"
            res=$(curl -sS -H "$AUTH" "$API/execute/Fileman/upload_files" \
              -F "dir=$dir" -F "overwrite=1" -F "file-1=@$f")
            if echo "$res" | grep -q '"status":1'; then echo "OK  $f"; else echo "ERR $f : $res"; fail=1; fi
          done < files.txt
          exit $fail
